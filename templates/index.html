<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAA X ADZAN // HOME</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ECECEC; --yellow: #F7D32C; --green: #A8F000; --cyan: #49D8F5; --black: #000000; --border: 4px solid var(--black); --shadow: 8px 8px 0px var(--black); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: 'JetBrains Mono', monospace; color: var(--black); padding-bottom: 80px; }
        
        /* HEADER */
        header { background: var(--black); color: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--border); position: sticky; top: 0; z-index: 40; }
        .clock { font-size: 0.8rem; font-weight: bold; color: var(--green); }
        
        /* HERO VIDEO */
        .hero-video-container { width: 100%; aspect-ratio: 16/9; background: black; border-bottom: var(--border); position: relative; overflow: hidden; }
        .hero-video-container iframe { width: 100%; height: 100%; border: none; }
        .hero-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); color: white; padding: 8px; font-size: 0.7rem; font-weight: bold; }

        /* SEARCH ICON TRIGGER */
        .search-trigger { padding: 24px; text-align: center; border-bottom: var(--border); background: var(--yellow); cursor: pointer; }
        .search-trigger i { font-size: 2rem; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* FULL PAGE SEARCH POPUP */
        #searchPopup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: none; flex-direction: column; padding: 20px; }
        #searchPopup.active { display: flex; }
        .popup-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .close-btn { background: red; color: white; border: var(--border); padding: 5px 10px; cursor: pointer; font-weight: bold; }
        .search-input-large { width: 100%; padding: 15px; font-size: 1.2rem; border: var(--border); font-family: inherit; margin-bottom: 20px; }
        .search-submit { background: var(--green); border: var(--border); padding: 15px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow); }

        /* FLOATING CS BUTTON */
        .fab-cs { position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px; background: var(--cyan); border: var(--border); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer; z-index: 50; box-shadow: var(--shadow); }
        
        /* CS POPUP MENU */
        #csPopup { position: fixed; bottom: 160px; right: 20px; background: var(--yellow); border: var(--border); padding: 10px; z-index: 50; display: none; box-shadow: var(--shadow); width: 200px; }
        #csPopup.show { display: block; }
        .cs-option { display: block; padding: 10px; border-bottom: 2px solid black; text-decoration: none; color: black; font-weight: bold; font-size: 0.8rem; }
        .cs-option:last-child { border: none; }
        .cs-close { position: absolute; top: -10px; right: -10px; background: red; color: white; width: 25px; height: 25px; border: 2px solid black; border-radius: 50%; text-align: center; line-height: 20px; cursor: pointer; font-weight: bold; }

        /* BOTTOM NAV */
        nav { position: fixed; bottom: 0; width: 100%; background: var(--black); border-top: var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 40; }
        nav a { color: white; text-decoration: none; text-align: center; font-size: 0.7rem; font-weight: bold; }
        nav a i { font-size: 1.2rem; display: block; margin-bottom: 4px; }
        nav a.active { color: var(--green); }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header>
        <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:1.2rem;"><i class="fas fa-bars"></i></button>
        <div class="clock" id="digitalClock">00:00:00 WIB</div>
        <div style="width: 20px;"></div>
    </header>

    <!-- Hero Video Makkah -->
    <div class="hero-video-container">
        <!-- GANTI URL DI SINI JIKA VIDEO MATI -->
        <iframe src="https://www.youtube.com/embed/jO7iJ7Q6zqU?autoplay=1&mute=1&controls=0&loop=1&playlist=jO7iJ7Q6zqU" allowfullscreen></iframe>
        <div class="hero-overlay">LIVE: MASJIDIL HARAM, MAKKAH</div>
    </div>

    <!-- Search Trigger -->
    <div class="search-trigger" onclick="openSearch()">
        <i class="fas fa-search"></i>
        <p class="uppercase font-bold mt-2">CARI LOKASI ADZAN GLOBAL</p>
    </div>

    <!-- Floating CS Button -->
    <div class="fab-cs" onclick="toggleCS()">
        <i class="fas fa-phone-alt"></i>
    </div>

    <!-- CS Popup Menu -->
    <div id="csPopup">
        <div class="cs-close" onclick="toggleCS()">X</div>
        <a href="https://t.me/CaaCyberr404" target="_blank" class="cs-option"><i class="fab fa-telegram"></i> TELEGRAM</a>
        <a href="https://wa.me/6285624481275" target="_blank" class="cs-option"><i class="fab fa-whatsapp"></i> WHATSAPP</a>
        <a href="mailto:sikecilpangerann@gmail.com" class="cs-option"><i class="fas fa-envelope"></i> EMAIL</a>
    </div>

    <!-- Full Page Search Popup -->
    <div id="searchPopup">
        <div class="popup-header">
            <h2 class="uppercase">PENCARIAN GLOBAL</h2>
            <button class="close-btn" onclick="closeSearch()">X</button>
        </div>
        <input type="text" id="searchInput" class="search-input-large" placeholder="KETIK NAMA KOTA...">
        <button class="search-submit" onclick="performSearch()">CARI SEKARANG <i class="fas fa-arrow-right"></i></button>
    </div>

    <!-- Bottom Nav -->
    <nav>
        <a href="/" class="active"><i class="fas fa-home"></i>HOME</a>
        <a href="/live"><i class="fas fa-broadcast-tower"></i>LIVE</a>
        <a href="/jadwal"><i class="fas fa-calendar-alt"></i>JADWAL</a>
    </nav>

    <script>
        // Jam Digital
        setInterval(() => {
            const now = new Date();
            document.getElementById('digitalClock').innerText = now.toLocaleTimeString('id-ID') + " WIB";
        }, 1000);

        // Toggle Menu Hamburger (Sederhana)
        function toggleMenu() { window.location.href = '/info'; } // Diarahkan ke info dulu untuk simpel

        // Search Logic
        function openSearch() { document.getElementById('searchPopup').classList.add('active'); }
        function closeSearch() { document.getElementById('searchPopup').classList.remove('active'); }
        
        function toggleCS() { 
            const popup = document.getElementById('csPopup');
            popup.classList.toggle('show');
        }

        function performSearch() {
            const city = document.getElementById('searchInput').value;
            if(city) {
                // Redirect ke halaman search result (kita buat nanti atau pakai live page)
                window.location.href = `/live?search=${city}`;
            }
        }
    </script>
</body>
</html>
